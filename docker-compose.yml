version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nuvora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuvora}
      POSTGRES_USER: ${POSTGRES_USER:-nuvora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nuvora-redis
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: nuvora-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://nuvora:change-me@postgres:5432/nuvora}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: nuvora-web
    environment:
      NODE_ENV: development
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
